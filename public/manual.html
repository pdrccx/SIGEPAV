<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual de usuario · SIGEPAV</title>
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="Styles.css">
    <link rel="stylesheet" href="responsive.css?v=sigepav-responsive-v14">
    <style>
        .manual-wrap {
            background:#fff; border:1px solid #e2e8f0; border-radius:.7rem;
            overflow:hidden; box-shadow:0 2px 10px rgba(0,0,0,.05);
        }
        .manual-toolbar {
            display:flex; align-items:center; gap:.6rem; padding:.7rem 1rem;
            border-bottom:1px solid #e2e8f0; background:#f8fafc;
        }
        .manual-toolbar .titulo { font-weight:700; color:#0d2d6b; display:flex; align-items:center; gap:.5rem; }
        .manual-toolbar .acciones { margin-left:auto; display:flex; gap:.5rem; }
        #visor-manual { width:100%; height:78vh; border:none; display:block; background:#525659; }
        .manual-fallback { padding:2.5rem 1rem; text-align:center; color:#64748b; }
    </style>
</head>
<body>
    <div class="modal-overlay" id="modal-overlay" style="display:none;"></div>

    <div id="app-container" style="display:flex;">

        <header class="barra-superior">
            <div class="barra-superior-contenido">
                <div class="barra-izquierda">
                    <div class="dropdown-modulos" id="dropdown-modulos-principal" data-navbar></div>
                    <img src="Logo.jpeg" alt="Logo" class="logo-barra" onerror="this.style.display='none'">
                    <div class="titulo-sistema">
                        <h1><a href="menu.html" style="color:inherit;text-decoration:none;cursor:pointer;">SIGEPAV</a></h1>
                    </div>
                </div>
                <div class="info-usuario">
                    <span class="icono-usuario"><i class="fas fa-user-circle"></i></span>
                    <span class="correo-usuario" id="user-email-display">Usuario</span>
                    <button id="logoutBtn" class="btn-logout-header"><i class="fas fa-sign-out-alt"></i> Salir</button>
                </div>
            </div>
        </header>

        <main class="contenedor-principal">
            <div class="subtitulo-seccion">
                <div class="encabezado-formulario">
                    <h2><i class="fas fa-book-open" style="color:#0d2d6b;margin-right:.4rem"></i> Manual de usuario</h2>
                    <p class="subtitulo-secundario">Guía de uso del sistema, visible dentro de SIGEPAV</p>
                </div>
            </div>

            <div class="manual-wrap">
                <div class="manual-toolbar">
                    <span class="titulo"><i class="fas fa-file-pdf"></i> Manual_SIGEPAV.pdf</span>
                    <div class="acciones">
                        <a class="btn-secundario btn-mini" href="Manual_SIGEPAV.pdf" download="Manual_SIGEPAV.pdf" title="Descargar una copia">
                            <i class="fas fa-download"></i> Descargar
                        </a>
                    </div>
                </div>
                <iframe id="visor-manual" title="Manual de usuario SIGEPAV"></iframe>
                <div class="manual-fallback" id="manual-fallback" style="display:none">
                    <p><i class="fas fa-triangle-exclamation"></i> Tu navegador no pudo mostrar el PDF aquí.</p>
                    <a class="btn-primario" href="Manual_SIGEPAV.pdf" target="_blank" rel="noopener">Abrir el manual</a>
                </div>
            </div>
        </main>
    </div>

    <footer class="barra-inferior">
        <div class="barra-inferior-contenido">
            <p>Tecnológico Nacional de México campus Zacatecas Norte</p>
        </div>
    </footer>
    <div class="toast" id="toast" aria-live="polite"></div>

    <script src="Config.js"></script>
    <script src="auth-guard.js"></script>
    <script src="Script.js"></script>
    <script src="navbar.js"></script>
    <script src="modulos-router.js"></script>
    <script>
    // Carga el PDF en el visor interno. Usa sigepavUrl para que funcione
    // también detrás de ngrok (header de bypass como query param).
    (function () {
        const iframe = document.getElementById('visor-manual');
        const base = 'Manual_SIGEPAV.pdf#toolbar=1&navpanes=0&view=FitH';
        const url = (typeof window.sigepavUrl === 'function') ? window.sigepavUrl(base) : base;
        iframe.src = url;
        // Si el PDF no carga en unos segundos, mostrar fallback.
        let cargado = false;
        iframe.addEventListener('load', () => { cargado = true; });
        setTimeout(() => {
            if (!cargado) {
                document.getElementById('manual-fallback').style.display = 'block';
            }
        }, 4000);
    })();
    </script>
    <script src="ui-interaction-fix.js?v=sigepav-ui-fix-v14"></script>
</body>
</html>
