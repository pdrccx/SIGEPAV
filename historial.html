<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historial de Cambios · SIGEPAV</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="Styles.css">
<link rel="stylesheet" href="historialStyles.css">
    <link rel="stylesheet" href="responsive.css?v=sigepav-responsive-v14">
</head>
<body>

<div class="modal-overlay" id="modal-overlay" style="display:none;"></div>

<div id="app-container" style="display:flex;">

    <header class="barra-superior">
        <div class="barra-superior-contenido">
            <div class="barra-izquierda">
                <div class="dropdown-modulos" id="dropdown-modulos-principal" data-navbar></div>
                <img src="Logo.jpeg" alt="Logo" class="logo-barra" onerror="this.style.display='none'">
                <div class="titulo-sistema"><h1><a href="menu.html" style="color:inherit;text-decoration:none;cursor:pointer;">SIGEPAV</a></h1></div>
            </div>
            <div class="info-usuario">
                <span class="icono-usuario"><i class="fas fa-user-circle"></i></span>
                <span class="correo-usuario" id="user-email-display">Usuario</span>
                <button id="logoutBtn" class="btn-logout-header">
                    <i class="fas fa-sign-out-alt"></i> Salir
                </button>
            </div>
        </div>
    </header>

    <main class="contenedor-principal">

        <div class="subtitulo-seccion">
            <div class="encabezado-formulario">
                <h2>Historial de cambios</h2>
                <p class="subtitulo-secundario">Auditoría completa de todas las acciones realizadas en el sistema.</p>
            </div>
        </div>

        <section class="resumen-cards">
            <div class="card-resumen">
                <div class="card-icono" style="background:#e6f0fa;color:#006dc8;"><i class="fas fa-history"></i></div>
                <div class="card-info">
                    <span class="card-numero" id="kpi-total">—</span>
                    <span class="card-etiqueta">Total de registros</span>
                </div>
            </div>
            <div class="card-resumen">
                <div class="card-icono" style="background:#eaf6f0;color:#1f9d67;"><i class="fas fa-plus-circle"></i></div>
                <div class="card-info">
                    <span class="card-numero" id="kpi-crear">—</span>
                    <span class="card-etiqueta">Creaciones</span>
                </div>
            </div>
            <div class="card-resumen">
                <div class="card-icono" style="background:#fff8e6;color:#e6a817;"><i class="fas fa-edit"></i></div>
                <div class="card-info">
                    <span class="card-numero" id="kpi-editar">—</span>
                    <span class="card-etiqueta">Ediciones</span>
                </div>
            </div>
            <div class="card-resumen">
                <div class="card-icono" style="background:#fdecea;color:#e53935;"><i class="fas fa-trash-alt"></i></div>
                <div class="card-info">
                    <span class="card-numero" id="kpi-eliminar">—</span>
                    <span class="card-etiqueta">Eliminaciones</span>
                </div>
            </div>
        </section>

        <section class="hist-filtros">
            <div class="filtro-grupo">
                <label><i class="fas fa-cubes"></i> Módulo</label>
                <select id="filtro-modulo">
                    <option value="">Todos los módulos</option>
                    <option value="vehiculos">Vehículos</option>
                    <option value="comisiones">Comisiones</option>
                    <option value="usuarios">Usuarios</option>
                    <option value="mantenimiento">Mantenimiento</option>
                    <option value="vales">Vales</option>
                    <option value="viajes">Viajes</option>
                    <option value="auth">Accesos</option>
                </select>
            </div>
            <div class="filtro-grupo filtro-grupo--sm">
                <label><i class="fas fa-calendar-day"></i> Desde</label>
                <input type="date" id="filtro-desde">
            </div>
            <div class="filtro-grupo filtro-grupo--sm">
                <label><i class="fas fa-calendar-day"></i> Hasta</label>
                <input type="date" id="filtro-hasta">
            </div>
            <div class="filtro-grupo">
                <label><i class="fas fa-search"></i> Buscar</label>
                <input type="text" id="filtro-buscar" placeholder="Acción, usuario, módulo…">
            </div>

            <div class="hist-acciones">
                <button class="hist-btn hist-btn--primary" id="btn-filtrar">
                    <i class="fas fa-filter"></i> Filtrar
                </button>
                <button class="hist-btn hist-btn--ghost" id="btn-limpiar">
                    <i class="fas fa-times"></i> Limpiar
                </button>
                <div class="hist-divisor"></div>
                <button class="hist-btn hist-btn--pdf" id="btn-descargar-pdf">
                    <i class="fas fa-file-pdf"></i> PDF
                </button>
                <button class="hist-btn hist-btn--excel" id="btn-descargar-excel">
                    <i class="fas fa-file-excel"></i> Excel
                </button>
            </div>
        </section>

        <section class="hist-contenedor">
            <div id="hist-cargando" class="hist-estado">
                <i class="fas fa-spinner fa-spin"></i> Cargando historial...
            </div>
            <div id="hist-vacio" class="hist-estado" style="display:none;">
                <i class="fas fa-inbox fa-2x" style="margin-bottom:.5rem;"></i><br>No hay registros que mostrar.
            </div>
            <div id="timeline"></div>
            <div class="hist-paginacion" id="hist-paginacion" style="display:none;">
                <button id="btn-anterior" class="btn-pag" disabled>
                    <i class="fas fa-chevron-left"></i> Anterior
                </button>
                <span id="pag-info">Página 1</span>
                <button id="btn-siguiente" class="btn-pag">
                    Siguiente <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </section>

    </main>
</div>

<footer class="barra-inferior">
    <span>Tecnológico Nacional de México campus Zacatecas Norte</span>
</footer>

<script src="Config.js"></script>
<script src="auth-guard.js"></script>
<script src="historialScript.js"></script>
<script src="navbar.js"></script>
<script src="modulos-router.js"></script>
<script src="ui-interaction-fix.js?v=sigepav-ui-fix-v14"></script></body>
</html>
