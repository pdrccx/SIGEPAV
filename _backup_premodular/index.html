<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/><link href="Styles.css" rel="stylesheet"/><title>SIGEPAV - Login</title>    <link rel="stylesheet" href="responsive.css?v=sigepav-responsive-v14">
</head><body data-login-page="true"><div class="login-overlay" id="login-container">
<div class="login-card">
<img alt="Logo" class="login-logo" src="Logo.jpeg"/>
<h2>SIGEPAV</h2>
<form id="login-form">
<div class="input-grupo">
<i class="fas fa-user"></i>
<input autocomplete="off" id="login-user" placeholder="Usuario" required="" type="text"/>
</div>
<div class="input-grupo">
<i class="fas fa-lock"></i>
<input id="login-password" placeholder="Contraseña" type="password"/>
</div>
<button class="btn-login" type="submit"><i class="fas fa-arrow-right-to-bracket"></i> Acceder</button>
<button class="btn-link-login" id="forgot-password-link" type="button"><i class="fas fa-key"></i> ¿Olvidaste la contraseña?</button>
</form>

<!-- ====== Formulario: solicitar enlace por correo ====== -->
<form class="recover-form" id="recover-form" style="display:none;">
<p class="recover-title"><i class="fas fa-envelope-open-text"></i> Recuperar acceso</p>
<p class="recover-text">Escribe el correo asociado a tu cuenta. Te enviaremos un enlace para crear una nueva contraseña.</p>
<div class="input-grupo">
<i class="fas fa-envelope"></i>
<input autocomplete="email" id="recover-email" placeholder="tu.correo@itszn.edu.mx" required="" type="email"/>
</div>
<button class="btn-login" id="recover-submit-btn" type="submit"><i class="fas fa-paper-plane"></i> Enviar enlace</button>
<button class="btn-link-login" id="back-to-login-link" type="button"><i class="fas fa-arrow-left"></i> Volver al login</button>
</form>

<!-- ====== Mensaje de éxito tras enviar el correo ====== -->
<div class="recover-success" id="recover-success" style="display:none;">
<div class="recover-success-icon"><i class="fas fa-paper-plane"></i></div>
<h3>¡Correo enviado!</h3>
<p class="recover-success-text">
Te enviamos un enlace para restablecer tu contraseña a <strong id="correo-enviado-a">tu correo</strong>.
</p>
<p class="recover-success-hint">
<i class="fas fa-circle-info"></i>
El enlace expira en <strong>15 minutos</strong>. Revisa también tu carpeta de spam.
</p>
<button class="btn-link-login" id="success-back-link" type="button"><i class="fas fa-arrow-left"></i> Volver al login</button>
</div>

<!-- ====== Toast de mensajes (en vez de alert) ====== -->
<div class="login-toast" id="login-toast" role="alert" aria-live="polite"></div>
</div>
</div><!-- Loading overlay global -->
<div id="sigepav-loading-overlay" role="status" aria-live="polite" aria-label="Cargando">
  <div class="sigepav-loading-card">
    <div class="sigepav-loading-spinner"></div>
    <p class="sigepav-loading-msg" id="sigepav-loading-msg">Procesando...</p>
  </div>
</div>
<script>
// Helper global para mostrar/ocultar el loading overlay
window.sigepavLoading = {
  show: function(msg) {
    var el = document.getElementById('sigepav-loading-overlay');
    var txt = document.getElementById('sigepav-loading-msg');
    if (txt) txt.textContent = msg || 'Procesando...';
    if (el) el.classList.add('activo');
  },
  hide: function() {
    var el = document.getElementById('sigepav-loading-overlay');
    if (el) el.classList.remove('activo');
  }
};
</script>
<script src="Config.js"></script><script src="Script.js"></script><script src="ui-interaction-fix.js?v=sigepav-ui-fix-v14"></script></body></html>
